# NotifyHub server deployment. See docs/deployment.md.
#   cp deploy/.env.example deploy/.env   # then edit secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: notifyhub

x-app-environment: &app-environment
  ConnectionStrings__NotifyHub: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-notifyhub};Username=${POSTGRES_USER:-notifyhub};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}"
  DOTNET_ENVIRONMENT: Production
  ASPNETCORE_ENVIRONMENT: Production

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.11-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notifyhub}
      POSTGRES_USER: ${POSTGRES_USER:-notifyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    # Deliberately no published ports: the database is reachable only on the internal backend network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: notifyhub-api:${NOTIFYHUB_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: api
    command: ["migrate"]
    environment: *app-environment
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: notifyhub-api:${NOTIFYHUB_VERSION:-local}
    restart: unless-stopped
    environment: *app-environment
    networks: [backend, frontend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: notifyhub-worker:${NOTIFYHUB_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment: *app-environment
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.7}
    restart: unless-stopped
    environment:
      NOTIFYHUB_DOMAIN: ${NOTIFYHUB_DOMAIN:-localhost}
    ports:
      - "${NOTIFYHUB_HTTP_PORT:-80}:80"
      - "${NOTIFYHUB_HTTPS_PORT:-443}:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    depends_on:
      api:
        condition: service_healthy

networks:
  backend:
    # No route to the outside world; only containers on this network can reach PostgreSQL.
    internal: true
  frontend: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
